version: "3.9"

services:
  perceptra:
    build: .
    container_name: perceptra_rt
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=file:///app/mlruns
    volumes:
      - .:/app
      - ./mlruns:/app/mlruns
      - ./output:/app/output
    command: python notebooks/validation.ipynb
    shm_size: "8gb"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: perceptra_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns
